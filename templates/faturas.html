{% extends "base.html" %}
{% block title %}Faturas – Axis{% endblock %}
{% block page_title %}Faturas de Cartão{% endblock %}

{% block topbar_actions %}
<button class="btn-help" onclick="openHelp('faturas')" aria-label="Ajuda sobre Faturas">❓ Ajuda</button>
{% endblock %}

{% block content %}
<div class="card">
  <div class="filters-row">
    <div class="filter-group">
      <label>Cartão</label>
      <select id="f-cartao-fatura">
        <option value="">Todos os cartões</option>
      </select>
    </div>
    <div class="filter-group filter-group--actions">
      <button class="btn btn-outline" onclick="abrirModalRecalcular()" aria-label="Recalcular faturas do cartão">
        ↻ Recalcular faturas
      </button>
    </div>
  </div>
</div>

<div id="faturas-container">
  <p class="text-muted text-center">Carregando...</p>
</div>
{% endblock %}

{% block scripts %}
<script>
async function initFaturas() {
  const { cartoes } = await apiGet('/api/contas_cartoes');
  const sel = document.getElementById('f-cartao-fatura');
  cartoes.forEach(c => {
    sel.innerHTML += `<option value="${c.id}">${escHtml(c.nome)}</option>`;
  });
  sel.addEventListener('change', carregarFaturas);
  carregarFaturas();
}

async function carregarFaturas() {
  const cartaoId = document.getElementById('f-cartao-fatura').value;
  const url = '/api/faturas' + (cartaoId ? `?cartao_id=${cartaoId}` : '');
  const faturas = await apiGet(url);
  renderFaturas(faturas || []);
}

function renderFaturas(faturas) {
  const container = document.getElementById('faturas-container');
  if (!faturas.length) {
    container.innerHTML = '<p class="text-muted text-center mt-4">Nenhuma fatura encontrada. Adicione transações com cartão para gerar faturas.</p>';
    return;
  }

  container.innerHTML = faturas.map(f => {
    const statusClass = f.status === 'paga' ? 'badge-realizado' : f.status === 'fechada' ? 'badge-fechada' : 'badge-previsto';
    const statusLabel = { paga: 'Paga', fechada: 'Fechada', aberta: 'Aberta' }[f.status];
    return `
      <div class="card fatura-card">
        <div class="fatura-header">
          <div>
            <strong>${escHtml(f.cartao_nome)}</strong>
            <span class="text-muted"> — ${formatMesRef(f.mes_referencia)}</span>
          </div>
          <div class="fatura-header-right">
            <span class="badge ${statusClass}">${statusLabel}</span>
            <strong class="fatura-total">${formatBRL(f.total)}</strong>
          </div>
        </div>
        <div class="fatura-info">
          <span>Fechamento: <strong>${formatDate(f.data_fechamento)}</strong></span>
          <span>Vencimento: <strong>${formatDate(f.data_vencimento)}</strong></span>
        </div>
        <div class="fatura-actions">
          <button class="btn btn-sm btn-outline" onclick="verFatura(${f.id})">Ver transações</button>
          ${f.status !== 'paga' ? `<button class="btn btn-sm btn-success" onclick="pagarFatura(${f.id})">Marcar como paga</button>` : ''}
        </div>
      </div>
    `;
  }).join('');
}

async function verFatura(id) {
  const f = await apiGet(`/api/faturas/${id}`);
  if (!f) return;
  const rows = (f.transacoes || []).map(t => `
    <tr>
      <td>${formatDate(t.data)}</td>
      <td>${escHtml(t.descricao)}</td>
      <td class="text-right negative">${formatBRL(t.valor)}</td>
    </tr>
  `).join('') || '<tr><td colspan="3" class="text-center text-muted">Sem transações</td></tr>';

  openModal(`Fatura ${formatMesRef(f.mes_referencia)} – ${escHtml(f.cartao_nome)}`, `
    <table>
      <thead><tr><th>Data</th><th>Descrição</th><th class="text-right">Valor</th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot>
        <tr><td colspan="2"><strong>Total</strong></td><td class="text-right negative"><strong>${formatBRL(f.total)}</strong></td></tr>
      </tfoot>
    </table>
  `);
}

async function pagarFatura(id) {
  const { contas } = await apiGet('/api/contas_cartoes');
  const contasOpts = contas.map(c => `<option value="${c.id}">${escHtml(c.nome)}</option>`).join('');
  openModal('Pagar Fatura', `
    <form id="form-pagar" onsubmit="confirmarPagamento(event, ${id})">
      <div class="form-group">
        <label>Conta de pagamento</label>
        <select name="conta_id">
          <option value="">Sem vínculo</option>
          ${contasOpts}
        </select>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-outline" onclick="closeModal()">Cancelar</button>
        <button type="submit" class="btn btn-success">Confirmar Pagamento</button>
      </div>
    </form>
  `);
}

async function confirmarPagamento(e, id) {
  e.preventDefault();
  const fd = new FormData(document.getElementById('form-pagar'));
  const body = {};
  for (const [k, v] of fd.entries()) body[k] = v;
  const ok = await apiPost(`/api/faturas/${id}/pagar`, body);
  if (ok) { closeModal(); showToast('Fatura marcada como paga!', 'success'); carregarFaturas(); }
}

function formatMesRef(ref) {
  if (!ref) return '';
  const [y, m] = ref.split('-');
  const meses = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  return `${meses[parseInt(m)-1]}/${y}`;
}

function abrirModalRecalcular() {
  const sel = document.getElementById('f-cartao-fatura');
  const cartaoId = sel.value;
  const cartaoOpts = Array.from(sel.options).filter(o => o.value)
    .map(o => `<option value="${o.value}"${o.value === cartaoId ? ' selected' : ''}>${escHtml(o.text)}</option>`)
    .join('');

  openModal('Recalcular Faturas', `
    <form id="form-recalcular" onsubmit="confirmarRecalcular(event)">
      <p class="text-muted" style="margin-bottom:1rem;">
        ⚠️ Esta ação revisa o vínculo de cada transação com sua fatura correta, usando a regra atual do cartão.
        <strong>Transações podem ser movidas mesmo que a fatura esteja paga.</strong>
        Apenas o vínculo com a fatura é alterado; valores e datas não são modificados.
      </p>
      <div class="form-group">
        <label for="rec-cartao">Cartão <span aria-hidden="true">*</span></label>
        <select id="rec-cartao" name="cartao_id" required aria-required="true">
          <option value="">Selecione um cartão</option>
          ${cartaoOpts}
        </select>
      </div>
      <div class="form-group">
        <label>Intervalo</label>
        <div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.5rem;">
          <button type="button" class="btn btn-sm btn-outline" onclick="setPreset(3, this)">3 meses</button>
          <button type="button" class="btn btn-sm btn-outline preset-btn preset-active" onclick="setPreset(6, this)">6 meses</button>
          <button type="button" class="btn btn-sm btn-outline" onclick="setPreset(12, this)">12 meses</button>
          <button type="button" class="btn btn-sm btn-outline" onclick="setPreset('custom', this)">Personalizado</button>
        </div>
        <div id="rec-custom-range" style="display:none;gap:.5rem;flex-wrap:wrap;">
          <div class="form-group" style="margin:0;flex:1;">
            <label for="rec-inicio">De</label>
            <input type="date" id="rec-inicio" name="data_inicio" aria-label="Data de início">
          </div>
          <div class="form-group" style="margin:0;flex:1;">
            <label for="rec-fim">Até</label>
            <input type="date" id="rec-fim" name="data_fim" aria-label="Data de fim">
          </div>
        </div>
        <input type="hidden" id="rec-months" name="months_back" value="6">
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-outline" onclick="closeModal()">Cancelar</button>
        <button type="submit" class="btn btn-primary">Recalcular</button>
      </div>
    </form>
  `);
  // Allow a brief render cycle for the modal DOM to be ready before focusing
  setTimeout(() => { const el = document.getElementById('rec-cartao'); if (el) el.focus(); }, 50);
}

function setPreset(val, btn) {
  const customDiv = document.getElementById('rec-custom-range');
  const monthsInput = document.getElementById('rec-months');
  const inicioInput = document.getElementById('rec-inicio');
  const fimInput = document.getElementById('rec-fim');
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('preset-active'));
  btn.classList.add('preset-active');
  if (val === 'custom') {
    customDiv.style.display = 'flex';
    monthsInput.value = '';
    inicioInput.required = true;
    fimInput.required = true;
  } else {
    customDiv.style.display = 'none';
    monthsInput.value = val;
    inicioInput.required = false;
    fimInput.required = false;
  }
}

async function confirmarRecalcular(e) {
  e.preventDefault();
  const form = document.getElementById('form-recalcular');
  const fd = new FormData(form);
  const body = {};
  for (const [k, v] of fd.entries()) { if (v !== '') body[k] = v; }
  if (!body.cartao_id) { showToast('Selecione um cartão.', 'error'); return; }
  // Convert numeric fields
  if (body.months_back) body.months_back = parseInt(body.months_back, 10);
  if (body.cartao_id) body.cartao_id = parseInt(body.cartao_id, 10);

  const submitBtn = form.querySelector('[type=submit]');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Recalculando…';

  const res = await apiPost('/api/faturas/recalcular', body);
  submitBtn.disabled = false;
  submitBtn.textContent = 'Recalcular';

  if (res) {
    const errosTxt = res.erros && res.erros.length
      ? `<br><small class="text-muted">${res.erros.length} erro(s) ignorado(s).</small>` : '';
    closeModal();
    showToast(
      `Recálculo concluído: ${res.total_movido} de ${res.total_analisado} transação(ões) movida(s).${errosTxt}`,
      res.erros && res.erros.length ? 'warning' : 'success'
    );
    carregarFaturas();
  }
}

document.addEventListener('DOMContentLoaded', initFaturas);</script>
{% endblock %}
