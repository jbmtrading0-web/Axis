<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Axis – Finanças{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme-light.css') }}" />
</head>
<body>
  <!-- Global config injected for JS -->
  <script>
    window.UI_MODE = {{ ui_mode | tojson }};
    window.ONBOARDING_COMPLETED = {{ onboarding_completed | tojson }};
  </script>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="logo-icon">💰</span>
      <span class="logo-text">Axis</span>
    </div>
    <nav class="sidebar-nav">
      <a href="{{ url_for('dashboard') }}" class="nav-item {% if request.endpoint == 'dashboard' %}active{% endif %}">
        <span class="nav-icon">📊</span><span>Dashboard</span>
      </a>
      <a href="{{ url_for('transacoes') }}" class="nav-item {% if request.endpoint == 'transacoes' %}active{% endif %}">
        <span class="nav-icon">💳</span><span>Transações</span>
      </a>
      <a href="{{ url_for('categorias') }}" class="nav-item {% if request.endpoint == 'categorias' %}active{% endif %}">
        <span class="nav-icon">🏷️</span><span>Categorias</span>
      </a>
      <a href="{{ url_for('contas') }}" class="nav-item {% if request.endpoint == 'contas' %}active{% endif %}">
        <span class="nav-icon">🏦</span><span>Contas</span>
      </a>
      <a href="{{ url_for('cartoes') }}" class="nav-item {% if request.endpoint == 'cartoes' %}active{% endif %}">
        <span class="nav-icon">💳</span><span>Cartões</span>
      </a>
      <a href="{{ url_for('faturas') }}" class="nav-item {% if request.endpoint == 'faturas' %}active{% endif %}">
        <span class="nav-icon">📋</span><span>Faturas</span>
      </a>
      <a href="{{ url_for('configuracoes') }}" class="nav-item {% if request.endpoint == 'configuracoes' %}active{% endif %}">
        <span class="nav-icon">⚙️</span><span>Configurações</span>
      </a>
    </nav>
  </aside>

  <!-- Main area -->
  <div class="main-wrapper">
    <header class="topbar">
      <button class="btn-menu" onclick="toggleSidebar()" aria-label="Menu">☰</button>
      <h1 class="page-title">{% block page_title %}Dashboard{% endblock %}</h1>
      <div class="topbar-actions">{% block topbar_actions %}{% endblock %}</div>
    </header>
    <main class="content">
      {% block content %}{% endblock %}
    </main>
  </div>

  <!-- Toast container -->
  <div id="toast-container"></div>

  <!-- Modal overlay -->
  <div class="modal-overlay" id="modal-overlay" onclick="closeModal()"></div>
  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <div class="modal-header">
      <h3 id="modal-title">Título</h3>
      <button class="modal-close" onclick="closeModal()" aria-label="Fechar">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>

  <!-- ══════════════════════════════════════════
       ONBOARDING WIZARD
  ══════════════════════════════════════════ -->
  <div class="onboarding-overlay" id="onboarding-overlay" role="dialog" aria-modal="true" aria-label="Configuração inicial">
    <div class="onboarding-modal" id="onboarding-modal">
      <div class="onboarding-header">
        <div class="onboarding-progress" id="onboarding-progress" aria-label="Progresso"></div>
        <div class="onboarding-title" id="onboarding-title"></div>
        <div class="onboarding-subtitle" id="onboarding-subtitle"></div>
      </div>
      <div class="onboarding-body" id="onboarding-body"></div>
      <div class="onboarding-footer">
        <button class="btn btn-outline" id="ob-btn-back" onclick="obBack()" style="visibility:hidden">← Voltar</button>
        <div class="onboarding-footer-right">
          <button class="btn btn-primary" id="ob-btn-next" onclick="obNext()">Continuar →</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════
       HELP DRAWER
  ══════════════════════════════════════════ -->
  <div class="help-overlay" id="help-overlay" onclick="closeHelp()"></div>
  <div class="help-drawer" id="help-drawer" role="complementary" aria-label="Ajuda contextual">
    <div class="help-drawer-header">
      <span class="help-drawer-title">❓ Ajuda — <span id="help-drawer-page"></span></span>
      <button class="modal-close" onclick="closeHelp()" aria-label="Fechar ajuda">✕</button>
    </div>
    <div class="help-drawer-body" id="help-drawer-body"></div>
  </div>

  <script src="{{ url_for('static', filename='js/chart.min.js') }}"></script>
  <script src="{{ url_for('static', filename='js/utils.js') }}"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
