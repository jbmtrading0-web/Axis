  <script>
    (function () {
      var SIDEBAR_KEY = 'axis.ui.sidebarCollapsed';
      var sidebar  = document.getElementById('sidebar');
      var wrapper  = document.getElementById('main-wrapper');
      var btn      = document.getElementById('sidebar-collapse-btn');

      function applyCollapsed(collapsed) {
        if (collapsed) {
          sidebar.classList.add('collapsed');
          wrapper.classList.add('sidebar-collapsed');
          if (btn) btn.setAttribute('aria-label', 'Expandir menu');
        } else {
          sidebar.classList.remove('collapsed');
          wrapper.classList.remove('sidebar-collapsed');
          if (btn) btn.setAttribute('aria-label', 'Recolher menu');
        }
      }

      window.toggleSidebarCollapse = function () {
        var isCollapsed = sidebar.classList.contains('collapsed');
        applyCollapsed(!isCollapsed);
        try { localStorage.setItem(SIDEBAR_KEY, !isCollapsed ? '1' : '0'); } catch (e) {}
      };

      try {
        var saved = localStorage.getItem(SIDEBAR_KEY);
        if (saved === '1') applyCollapsed(true);
      } catch (e) {}
    }());
  </script>
